<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قائمة المقهى</title>
<style>
  body{font-family:Tahoma,Arial,sans-serif;margin:0;background:#faf6f0;color:#2b2118}
  header{background:#4a2c17;color:#fff;text-align:center;padding:24px 12px}
  h1{margin:0;font-size:26px}
  main{max-width:520px;margin:auto;padding:16px}
  h2{border-bottom:2px solid #c98b4b;padding-bottom:6px;margin-top:28px}
  .item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed #d9c9b5}
  .price{font-weight:bold;color:#8a4b14}
  a.btn{display:block;text-align:center;background:#25d366;color:#fff;padding:14px;border-radius:10px;margin:24px 0;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<header><h1>مقهى النموذج</h1><p>قائمة الطعام والمشروبات</p></header>
<main id="menu"></main>
<main><a class="btn" href="https://wa.me/212600000000" target="_blank">اطلب عبر واتساب</a></main>
<script>
const data = {
  "المشروبات الساخنة": [["قهوة سوداء", 12], ["نص نص", 15], ["شاي بالنعناع", 10]],
  "المشروبات الباردة": [["عصير برتقال", 18], ["موهيتو", 25]],
  "الحلويات": [["كرواسان", 8], ["كيك الشوكولا", 20]]
};
const root = document.getElementById("menu");
for (const [cat, items] of Object.entries(data)) {
  let html = "<h2>" + cat + "</h2>";
  for (const [name, price] of items) {
    html += '<div class="item"><span>' + name + '</span><span class="price">' + price + ' درهم</span></div>';
  }
  root.innerHTML += html;
}
</script>
</body>
</html>
